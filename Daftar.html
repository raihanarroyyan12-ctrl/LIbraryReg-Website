  </head>
  <body>
    <header class="site-nav">
      <div class="container nav-bar">
        <a class="logo-container" href="index.html">
          <img src="C:\Users\Public\Coding\ETS Perpus\image\Screenshot 2026-10-21 103144.png" alt="Logo LibraryReg" class="logo-img" />
          <span class="logo-text">LibraryReg</span>
        </a>
        <input type="checkbox" id="nav-toggle" class="nav-check" aria-label="Buka menu" />
        <label for="nav-toggle" class="nav-toggle">Menu</label>
        <nav class="nav-menu">
          <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="anggota.html">Daftar Anggota</a></li>
            <li><a href="daftar.html" class="active" aria-current="page">Pendaftaran</a></li>
            <li><a href="petugas.html">Login Petugas</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="container content-section">
        <h2>Pendaftaran anggota</h2>
        <form class="row g-3 form-narrow" action="anggota.html" method="get">
          <div class="col-12">
            <label class="form-label" for="nama">Nama lengkap</label>
            <input class="form-control" id="nama" name="nama" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="nim">NIM/NIP</label>
            <input
              class="form-control"
              id="nim"
              name="nim"
              required
              inputmode="numeric"
              pattern="[0-9]+"
              title="Hanya angka"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="prodi">Program studi</label>
            <input class="form-control" id="prodi" name="prodi" required />
          </div>
          <div class="col-12">
            <label class="form-label" for="alamat">Alamat</label>
            <textarea class="form-control" id="alamat" name="alamat" rows="2" required></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="telp">Nomor telepon</label>
            <input
              class="form-control"
              id="telp"
              name="telp"
              required
              type="tel"
              pattern="[0-9+\- ]{{8,16}}"
              title="8-16 digit angka"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" required type="email" />
          </div>
          <div class="col-12">
            <label class="form-label" for="jenis">Jenis keanggotaan</label>
            <select class="form-select" id="jenis" name="jenis" required>
              <option value="">Pilih jenis keanggotaan</option>
              <option>Mahasiswa</option>
              <option>Dosen</option>
              <option>Tenaga Kependidikan</option>
            </select>
          </div>
          <div class="col-12">
            <button class="btn btn-accent btn-lg" type="submit">Daftar sekarang</button>
          </div>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <div class="row g-3">
          <div class="col-md-6">
            <h3>Kontak</h3>
            <p class="mb-1">Gedung Perpustakaan Kampus, Surabaya</p>
            <p class="mb-1">Telepon: (031) 555-0123</p>
            <p class="mb-0">Email: LibraryReg@gmail.com</p>
          </div>
          <div class="col-md-6">
            <h3>Jam layanan</h3>
            <p class="mb-1">Senin - Jumat: 08.00 - 20.00</p>
            <p class="mb-1">Sabtu: 08.00 - 14.00</p>
            <p class="mb-0">Minggu dan hari libur: tutup</p>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
