    <header class="site-nav">
      <div class="container nav-bar">
        <a class="logo-container" href="index.html">

        <input type="checkbox" id="nav-toggle" class="nav-check" aria-label="Buka menu" />

    <main>
      <section class="container content-section">
        <h2>Login petugas</h2>
        <form class="form-narrow" action="panel.html" method="get">
          <div class="mb-3">
            <label class="form-label" for="user">Username</label>
            <input class="form-control" id="user" name="user" required autocomplete="username" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="pass">Password</label>
            <input
              class="form-control"
              id="pass"
              name="pass"
              type="password"
              required
              autocomplete="current-password"
            />
          </div>
          <button class="btn btn-accent" type="submit">Masuk</button>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <div class="row g-3">

            <h3>Kontak</h3>

            <p class="mb-0">Email: LibraryReg@gmail.com</p>
          </div>
          <div class="col-md-6">

            <p class="mb-1">Senin - Jumat: 08.00 - 20.00</p>
            <p class="mb-1">Sabtu: 08.00 - 14.00</p>
